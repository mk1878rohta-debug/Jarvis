<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal AI Chat</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#111827',
                            panel: '#1f2937',
                            border: '#374151',
                            text: '#f3f4f6',
                            muted: '#9ca3af'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        /* Markdown Styles */
        .prose pre { background-color: #111827; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        .prose code { font-family: monospace; background-color: #374151; padding: 0.125rem 0.25rem; border-radius: 0.25rem; }
        .prose p { margin-bottom: 0.75rem; }
        .prose ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 0.75rem; }
        .prose ol { list-style-type: decimal; margin-left: 1.5rem; margin-bottom: 0.75rem; }
        .prose a { color: #60a5fa; text-decoration: underline; }
        
        /* Loading Animation */
        .typing-indicator span {
            display: inline-block;
            width: 6px; height: 6px;
            background-color: #9ca3af;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-dark-bg text-dark-text h-screen flex overflow-hidden selection:bg-blue-500 selection:text-white antialiased">

    <!-- Sidebar (History) -->
    <aside id="sidebar" class="bg-dark-panel w-64 border-r border-dark-border flex flex-col transition-transform duration-300 absolute z-20 h-full md:relative md:translate-x-0 -translate-x-full">
        <div class="p-4 border-b border-dark-border flex justify-between items-center">
            <h2 class="font-bold text-lg tracking-wide"><i class="fa-solid fa-bolt text-blue-500 mr-2"></i>Nexus AI</h2>
            <button id="close-sidebar-btn" class="md:hidden text-dark-muted hover:text-white">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        
        <div class="p-4">
            <button id="new-chat-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg flex items-center justify-center transition-colors">
                <i class="fa-solid fa-plus mr-2"></i> New Chat
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-2 space-y-1" id="history-list">
            <!-- History items generated by JS -->
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full relative w-full">
        <!-- Header -->
        <header class="h-14 border-b border-dark-border flex items-center justify-between px-4 bg-dark-panel bg-opacity-80 backdrop-blur-sm z-10">
            <div class="flex items-center">
                <button id="open-sidebar-btn" class="md:hidden text-dark-muted hover:text-white mr-4">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <span id="current-model-display" class="font-medium text-dark-muted text-sm bg-dark-bg px-3 py-1 rounded-full border border-dark-border">
                    Select a model
                </span>
            </div>
            <button id="open-settings-btn" class="text-dark-muted hover:text-white transition-colors" title="Settings">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
        </header>

        <!-- Chat Container -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth flex flex-col items-center">
            <div id="welcome-screen" class="flex-1 flex flex-col items-center justify-center text-center max-w-2xl w-full">
                <div class="w-20 h-20 bg-blue-600 rounded-full flex items-center justify-center mb-6 shadow-lg shadow-blue-500/20">
                    <i class="fa-solid fa-robot text-4xl text-white"></i>
                </div>
                <h1 class="text-3xl font-bold mb-2">How can I help you today?</h1>
                <p class="text-dark-muted mb-8">Ensure your OpenRouter API key is configured in settings before starting.</p>
            </div>
            
            <div id="messages-list" class="w-full max-w-4xl space-y-6 hidden pb-24">
                <!-- Messages appended here -->
            </div>
        </div>

        <!-- Input Area -->
        <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-dark-bg via-dark-bg to-transparent pt-6 pb-4 px-4 md:px-8">
            <div class="max-w-4xl mx-auto relative">
                <textarea id="chat-input" rows="1" placeholder="Message AI..." class="w-full bg-dark-panel border border-dark-border rounded-xl pl-4 pr-12 py-4 text-white placeholder-dark-muted focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 resize-none max-h-32 overflow-y-auto transition-all"></textarea>
                <button id="send-btn" class="absolute right-3 bottom-3 p-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
            <div class="text-center mt-2 text-xs text-dark-muted">
                AI can make mistakes. Consider verifying important information.
            </div>
        </div>
    </main>

    <!-- Settings Modal (Hidden by default) -->
    <div id="settings-modal" class="fixed inset-0 bg-black bg-opacity-60 backdrop-blur-sm flex items-center justify-center z-50 hidden opacity-0 transition-opacity">
        <div class="bg-dark-panel border border-dark-border rounded-xl w-full max-w-md p-6 transform scale-95 transition-transform shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold">Settings</h3>
                <button id="close-settings-btn" class="text-dark-muted hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">OpenRouter API Key</label>
                    <input type="password" id="api-key-input" placeholder="sk-or-v1-..." class="w-full bg-dark-bg border border-dark-border rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Model Name</label>
                    <input type="text" id="model-input" placeholder="google/gemini-pro" class="w-full bg-dark-bg border border-dark-border rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                    <p class="text-xs text-dark-muted mt-1">Examples: google/gemini-pro, anthropic/claude-3-haiku, openai/gpt-4-turbo</p>
                </div>
            </div>
            
            <div class="mt-8 flex justify-end">
                <button id="save-settings-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg font-medium transition-colors">
                    Save Changes
                </button>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // === State Management ===
            let config = {
                apiKey: localStorage.getItem('universalAi_apiKey') || '',
                model: localStorage.getItem('universalAi_model') || 'google/gemini-pro'
            };
            
            let chatHistory = JSON.parse(localStorage.getItem('universalAi_history')) || [];
            let currentChatId = null;

            // === DOM Elements ===
            const els = {
                sidebar: document.getElementById('sidebar'),
                openSidebarBtn: document.getElementById('openSidebarBtn'),
                closeSidebarBtn: document.getElementById('close-sidebar-btn'),
                newChatBtn: document.getElementById('new-chat-btn'),
                historyList: document.getElementById('history-list'),
                
                settingsModal: document.getElementById('settings-modal'),
                openSettingsBtn: document.getElementById('open-settings-btn'),
                closeSettingsBtn: document.getElementById('close-settings-btn'),
                saveSettingsBtn: document.getElementById('save-settings-btn'),
                apiKeyInput: document.getElementById('api-key-input'),
                modelInput: document.getElementById('model-input'),
                currentModelDisplay: document.getElementById('current-model-display'),
                
                chatContainer: document.getElementById('chat-container'),
                welcomeScreen: document.getElementById('welcome-screen'),
                messagesList: document.getElementById('messages-list'),
                chatInput: document.getElementById('chat-input'),
                sendBtn: document.getElementById('send-btn')
            };

            // === Initialization ===
            init();

            function init() {
                updateModelDisplay();
                renderHistoryList();
                setupEventListeners();
                
                // If there's history, load the most recent chat, else prepare new chat
                if (chatHistory.length > 0) {
                    loadChat(chatHistory[0].id);
                }
            }

            // === Event Listeners ===
            function setupEventListeners() {
                // UI Toggles
                document.getElementById('open-sidebar-btn').addEventListener('click', () => toggleSidebar(true));
                els.closeSidebarBtn.addEventListener('click', () => toggleSidebar(false));
                
                els.openSettingsBtn.addEventListener('click', openSettings);
                els.closeSettingsBtn.addEventListener('click', closeSettings);
                els.saveSettingsBtn.addEventListener('click', saveSettings);
                
                els.newChatBtn.addEventListener('click', createNewChat);
                
                // Input handling
                els.chatInput.addEventListener('input', autoResizeInput);
                els.chatInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        handleSend();
                    }
                });
                els.sendBtn.addEventListener('click', handleSend);
            }

            // === UI Functions ===
            function toggleSidebar(show) {
                if (show) els.sidebar.classList.remove('-translate-x-full');
                else els.sidebar.classList.add('-translate-x-full');
            }

            function openSettings() {
                els.apiKeyInput.value = config.apiKey;
                els.modelInput.value = config.model;
                els.settingsModal.classList.remove('hidden');
                // Small delay to allow CSS transition
                setTimeout(() => {
                    els.settingsModal.classList.remove('opacity-0');
                    els.settingsModal.querySelector('div').classList.remove('scale-95');
                }, 10);
            }

            function closeSettings() {
                els.settingsModal.classList.add('opacity-0');
                els.settingsModal.querySelector('div').classList.add('scale-95');
                setTimeout(() => els.settingsModal.classList.add('hidden'), 300);
            }

            function saveSettings() {
                config.apiKey = els.apiKeyInput.value.trim();
                config.model = els.modelInput.value.trim() || 'google/gemini-pro';
                
                localStorage.setItem('universalAi_apiKey', config.apiKey);
                localStorage.setItem('universalAi_model', config.model);
                
                updateModelDisplay();
                closeSettings();
            }

            function updateModelDisplay() {
                els.currentModelDisplay.textContent = config.model;
            }

            function autoResizeInput() {
                els.chatInput.style.height = 'auto';
                els.chatInput.style.height = Math.min(els.chatInput.scrollHeight, 128) + 'px';
            }

            function scrollToBottom() {
                els.chatContainer.scrollTop = els.chatContainer.scrollHeight;
            }

            // === Chat Logic ===
            function createNewChat() {
                currentChatId = null;
                els.welcomeScreen.classList.remove('hidden');
                els.messagesList.classList.add('hidden');
                els.messagesList.innerHTML = '';
                els.chatInput.value = '';
                els.chatInput.focus();
                
                // Reset active state in sidebar
                document.querySelectorAll('.history-item').forEach(el => {
                    el.classList.remove('bg-dark-border', 'text-white');
                    el.classList.add('text-dark-muted');
                });
                if(window.innerWidth < 768) toggleSidebar(false);
            }

            function saveChatToHistory(role, content) {
                if (!currentChatId) {
                    currentChatId = Date.now().toString();
                    const title = content.length > 30 ? content.substring(0, 30) + '...' : content;
                    chatHistory.unshift({
                        id: currentChatId,
                        title: title,
                        messages: []
                    });
                }
                
                const chatIndex = chatHistory.findIndex(c => c.id === currentChatId);
                chatHistory[chatIndex].messages.push({ role, content });
                localStorage.setItem('universalAi_history', JSON.stringify(chatHistory));
                renderHistoryList();
            }

            function loadChat(id) {
                const chat = chatHistory.find(c => c.id === id);
                if (!chat) return;
                
                currentChatId = id;
                els.welcomeScreen.classList.add('hidden');
                els.messagesList.classList.remove('hidden');
                els.messagesList.innerHTML = '';
                
                chat.messages.forEach(msg => appendMessageUI(msg.role, msg.content));
                renderHistoryList(); // Update active states
                scrollToBottom();
                if(window.innerWidth < 768) toggleSidebar(false);
            }

            function renderHistoryList() {
                els.historyList.innerHTML = '';
                chatHistory.forEach(chat => {
                    const isActive = chat.id === currentChatId;
                    const btn = document.createElement('button');
                    btn.className = `history-item w-full text-left px-3 py-2.5 rounded-lg text-sm flex items-center group transition-colors ${isActive ? 'bg-dark-border text-white' : 'text-dark-muted hover:bg-dark-border/50 hover:text-white'}`;
                    
                    btn.innerHTML = `
                        <i class="fa-regular fa-message mr-3"></i>
                        <span class="truncate flex-1">${chat.title}</span>
                        <div class="delete-btn opacity-0 group-hover:opacity-100 hover:text-red-400 p-1" data-id="${chat.id}">
                            <i class="fa-solid fa-trash text-xs"></i>
                        </div>
                    `;
                    
                    btn.addEventListener('click', (e) => {
                        if (e.target.closest('.delete-btn')) {
                            e.stopPropagation();
                            deleteChat(chat.id);
                        } else {
                            loadChat(chat.id);
                        }
                    });
                    
                    els.historyList.appendChild(btn);
                });
            }

            function deleteChat(id) {
                chatHistory = chatHistory.filter(c => c.id !== id);
                localStorage.setItem('universalAi_history', JSON.stringify(chatHistory));
                if (currentChatId === id) {
                    createNewChat();
                } else {
                    renderHistoryList();
                }
            }

            // === Message Rendering & API Call ===
            async function handleSend() {
                const text = els.chatInput.value.trim();
                if (!text) return;
                if (!config.apiKey) {
                    alert("Please set your OpenRouter API Key in settings first.");
                    openSettings();
                    return;
                }

                // UI Cleanup
                els.chatInput.value = '';
                els.chatInput.style.height = 'auto';
                els.welcomeScreen.classList.add('hidden');
                els.messagesList.classList.remove('hidden');
                els.sendBtn.disabled = true;

                // Process User Message
                appendMessageUI('user', text);
                saveChatToHistory('user', text);
                scrollToBottom();

                // Prepare Loading AI Message
                const loadingId = 'loading-' + Date.now();
                appendLoadingUI(loadingId);
                scrollToBottom();

                // API Request Build
                const activeChat = chatHistory.find(c => c.id === currentChatId);
                const apiMessages = activeChat.messages.map(m => ({
                    role: m.role === 'model' ? 'assistant' : 'user',
                    content: m.content
                }));

                try {
                    const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${config.apiKey}`,
                            "HTTP-Referer": window.location.href, // Recommended for OpenRouter
                            "X-Title": "Universal Static UI",       // Recommended for OpenRouter
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            model: config.model,
                            messages: apiMessages
                        })
                    });

                    const data = await response.json();
                    
                    if (data.error) throw new Error(data.error.message);
                    
                    const aiContent = data.choices[0].message.content;
                    
                    // Update UI and State
                    removeLoadingUI(loadingId);
                    appendMessageUI('model', aiContent);
                    saveChatToHistory('model', aiContent);
                    
                } catch (error) {
                    removeLoadingUI(loadingId);
                    appendMessageUI('model', `**Error:** ${error.message}`);
                    saveChatToHistory('model', `Error: ${error.message}`);
                } finally {
                    els.sendBtn.disabled = false;
                    els.chatInput.focus();
                    scrollToBottom();
                }
            }

            function appendMessageUI(role, content) {
                const div = document.createElement('div');
                div.className = 'flex w-full';
                
                if (role === 'user') {
                    div.innerHTML = `
                        <div class="ml-auto bg-blue-600 text-white px-5 py-3 rounded-2xl rounded-tr-sm max-w-[85%] whitespace-pre-wrap leading-relaxed shadow-sm">
                            ${escapeHTML(content)}
                        </div>
                    `;
                } else {
                    div.innerHTML = `
                        <div class="flex max-w-[90%]">
                            <div class="flex-shrink-0 w-8 h-8 rounded-full bg-dark-border flex items-center justify-center mr-4 mt-1">
                                <i class="fa-solid fa-robot text-sm text-dark-muted"></i>
                            </div>
                            <div class="prose prose-invert max-w-none text-dark-text leading-relaxed">
                                ${marked.parse(content)}
                            </div>
                        </div>
                    `;
                }
                els.messagesList.appendChild(div);
            }

            function appendLoadingUI(id) {
                const div = document.createElement('div');
                div.id = id;
                div.className = 'flex w-full';
                div.innerHTML = `
                    <div class="flex max-w-[90%]">
                        <div class="flex-shrink-0 w-8 h-8 rounded-full bg-dark-border flex items-center justify-center mr-4 mt-1">
                            <i class="fa-solid fa-robot text-sm text-dark-muted"></i>
                        </div>
                        <div class="flex items-center h-10 typing-indicator">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                `;
                els.messagesList.appendChild(div);
            }

            function removeLoadingUI(id) {
                const el = document.getElementById(id);
                if (el) el.remove();
            }

            function escapeHTML(str) {
                return str.replace(/[&<>'"]/g, 
                    tag => ({
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        "'": '&#39;',
                        '"': '&quot;'
                    }[tag] || tag)
                );
            }
        });
    </script>
</body>
</html>
